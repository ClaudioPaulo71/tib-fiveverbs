services:
  # --- Banco de Dados (PostgreSQL) ---
  db:
    image: postgres:15
    container_name: fiveverbs_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=fiveverbs_db
      - POSTGRES_USER=fiveverbs_user
      - POSTGRES_PASSWORD=fiveverbs_password
    networks:
      - internal_net
    restart: always

  # --- Aplicação Web (Django) ---
  web:
    build: .
    container_name: fiveverbs_web
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    ports:
      - "8006:8000"
    depends_on:
      - db
    networks:
      - internal_net

  # --- Frontend (React + Vite) ---
  frontend:
    build: ./frontend
    container_name: fiveverbs_frontend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - internal_net

volumes:
  postgres_data:
  frontend_node_modules:


networks:
  internal_net:
    driver: bridge
